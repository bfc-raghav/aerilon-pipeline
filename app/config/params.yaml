# Operational parameters — changes here are classified "parameter-affecting"
# by impact_analysis.py and trip the stricter org policies.

# LED status ring (route verdict display)
led_colour: 0,80,255      # idle colour before first assessment
led_safe_colour: 0,255,0
led_unsafe_colour: 255,0,0
led_pattern: spin         # spin | solid
led_count: 24

# Recon / detection  (Problem 3)
video_source: http://127.0.0.1:5000/video_feed   # raspiCamSrv on the SAME Pi
detector_model: yolov8n.pt
detector_confidence: 0.5

# Route safety decision  (SAFETY-CRITICAL consumers)
safety_threshold: 70      # score must EXCEED this to call the route safe
person_penalty: 15        # usability points lost per detected person

# GCS telemetry
telemetry_ip: 192.168.1.108
telemetry_port: 5005
